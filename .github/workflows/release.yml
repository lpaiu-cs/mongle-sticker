name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*'  # v1.0, v1.1 등 v로 시작하는 태그가 푸시될 때 자동으로 실행됩니다.

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyInstaller
          # 필요한 패키지가 더 있다면 여기에 추가하세요 (예: pip install requests)

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --icon=icon.ico --name "몽글몽글 스티커" main.py

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/몽글몽글 스티커.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
