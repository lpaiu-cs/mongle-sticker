name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*'  # v1.0, v1.1 등 v로 시작하는 태그가 푸시될 때 실행됩니다.

permissions:
  contents: write

jobs:
  build:
    name: 🔨 Build Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # 태그와 소스의 버전이 어긋난 채로 릴리스가 나가는 것을 막습니다.
      # 실패하면 _version.py를 올리거나 태그를 다시 만들면 됩니다.
      - name: Verify Tag Matches Source Version
        run: |
          $tag = "${{ github.ref_name }}"
          $source = python -c "import _version; print(_version.__version__)"
          if ($tag -ne "v$source") {
            Write-Host "::error::Tag '$tag' does not match _version.py ('$source'). Bump _version.py or retag."
            exit 1
          }
          Write-Host "Version check passed: $tag"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # version.txt는 생성물입니다. _version.py가 유일한 버전 소스입니다.
      - name: Generate Version Resource
        run: python tools/make_version_file.py

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean --noconsole --onefile --icon=icon.ico --version-file version.txt --name "몽글몽글 스티커" main.py

      # GitHub 업로드 API는 한글 파일명을 default로 치환하므로,
      # 릴리스 자산은 예측 가능한 ASCII 이름(버전 포함)으로 올립니다.
      - name: Rename Executable for Release Asset
        run: |
          $version = python -c "import _version; print(_version.__version__)"
          Copy-Item -LiteralPath "dist/몽글몽글 스티커.exe" -Destination "dist/MongleSticker-$version.exe"
          Get-ChildItem dist

      - name: Upload Artifact for Release Job
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/MongleSticker-*.exe
          retention-days: 1

  release:
    name: 🚀 Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Built Executable
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: dist/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MongleSticker-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
